syntax = "proto3";

package featurestore.common;

option go_package = "featurestore/common";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_DEPRECATED = 2;
  STATUS_DISABLED = 3;
}

enum FeatureType {
  FEATURE_TYPE_UNSPECIFIED = 0;
  FEATURE_TYPE_NUMERICAL = 1;
  FEATURE_TYPE_CATEGORICAL = 2;
  FEATURE_TYPE_BOOLEAN = 3;
  FEATURE_TYPE_VECTOR = 4;
  FEATURE_TYPE_TEXT = 5;
}

enum StoreType {
  STORE_TYPE_UNSPECIFIED = 0;
  STORE_TYPE_POSTGRES = 1;
  STORE_TYPE_REDIS = 2;
  STORE_TYPE_ELASTIC = 3;
  STORE_TYPE_VECTOR_DB = 4;
  STORE_TYPE_OFFLINE = 5;
}

message Metadata {
  string owner = 1;
  string description = 2;
  map<string, string> tags = 3;
}

message AuditInfo {
  google.protobuf.Timestamp created_at = 1;
  google.protobuf.Timestamp updated_at = 2;
  string created_by = 3;
}

message Pagination {
  int32 page = 1;
  int32 page_size = 2;
}

message Error {
  string code = 1;
  string message = 2;
}
